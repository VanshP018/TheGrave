# Local development infrastructure. App processes (server/web) run on the host via `pnpm dev`.
name: thegrave
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grave
      POSTGRES_PASSWORD: grave
      POSTGRES_DB: thegrave
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grave -d thegrave"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6389:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP server + web inbox for dev email (decision.md D-077): the app sends real SMTP to :1025,
  # every message shows up at http://localhost:8025. Nothing leaves this machine.
  mailpit:
    image: axllent/mailpit:v1.21.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
